<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face { font-family: Readex; src: url(../../../assets/fonts/ReadexPro-Bold.ttf); font-weight: 700; }
@font-face { font-family: Readex; src: url(../../../assets/fonts/ReadexPro-SemiBold.ttf); font-weight: 600; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { font-family: Readex, sans-serif; color: #F3F2EC; position: relative;
  background: radial-gradient(120% 90% at 85% 0%, #1E4B3C 0%, #12342A 55%, #0B2119 100%); }
.flourish { position: absolute; opacity: .09; width: 1620px; left: -594px; top: 760px; }
.brand { position: absolute; top: 84px; inset-inline-start: 84px; display: flex; align-items: center; gap: 22px; }
.brand b { font-size: 64px; font-weight: 700; letter-spacing: 0; }
.copy { position: absolute; inset-inline-start: 84px; top: 274px; width: 912px; }
h1 { font-size: 112px; line-height: 1.2; font-weight: 700; }
h1 span:nth-child(1) { color: #F3F2EC; } h1 span:nth-child(2) { color: #D3F27A; } h1 span:nth-child(3) { color: #F3F2EC; }
h1 span { display: block; } h1 span + span { margin-inline-start: 0; }
p.tag { margin-top: 30px; font-size: 40px; font-weight: 600; color: #C9D6CE; max-width: 760px; line-height: 1.35; }
.stage { position: absolute; perspective: 1800px; inset-inline-end: 340px; bottom: 220px; }
.phone { width: 400px; aspect-ratio: 780 / 1688; border-radius: 52px; padding: 14.000000000000002px; background: #0A1712;
  transform: rotateY(16deg) rotateX(6deg) rotateZ(-2deg); transform-style: preserve-3d;
  box-shadow: -40px 60px 90px rgba(0,0,0,.45), 0 0 0 2px #2A3B35 inset; }
.phone img { width: 100%; height: 100%; border-radius: 40px; display: block; object-fit: cover; object-position: top; }
.chips { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.chip { position: relative; display: flex; align-items: center; gap: 14px; transform-style: preserve-3d; }
.chip .face { width: var(--s); height: var(--s); border-radius: calc(var(--s) * .3); background: var(--t); display: grid; place-items: center;
  box-shadow: 0 calc(var(--s) * .09) 0 color-mix(in srgb, var(--c) 55%, #12342A), 0 calc(var(--s) * .35) calc(var(--s) * .45) rgba(0,0,0,.35); }
.chip span { font-size: 30px; font-weight: 600; background: rgba(243,242,236,.96); color: #0E1F19; padding: 10px 18px; border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); white-space: nowrap; }
.c1, .c2, .c3 { position: absolute; transform-style: preserve-3d; }
.c1 { top: 5%; inset-inline-start: -90px; transform: translateZ(120px) rotate(-6deg); }
.c2 { top: 44%; inset-inline-end: -10px; transform: translateZ(160px) rotate(5deg); }
.c3 { bottom: 9%; inset-inline-start: -110px; transform: translateZ(100px) rotate(-3deg); }
.cta { position: absolute; inset-inline-start: 84px; bottom: 84px; display: flex; align-items: center; gap: 16px;
  background: #D3F27A; color: #12342A; font-size: 34px; font-weight: 700; padding: 22px 34px; border-radius: 999px;
  box-shadow: 0 6px 0 #9DBD3F, 0 20px 40px rgba(0,0,0,.3); }
.cta i { font-style: normal; font-size: 22px; font-weight: 600; opacity: .75; }
</style></head><body>
