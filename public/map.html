<!doctype html>
<!-- Android app map (SPEC-android-map.md): the APK has no Google Maps key, so src/route-map.android.tsx shows this page
     in a WebView. Same MapLibre + OpenFreeMap setup as src/route-map.tsx (web); keep the two in step.
     Input: JSON in the URL fragment (never sent to the server), then window.wind({driver, road, focus}) updates.
     Output: ReactNativeWebView.postMessage of {type: 'ready' | 'failed'} and, in pin mode, {type: 'center', latitude, longitude}. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/vendor/maplibre-6.12.0/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #E6ECE3; }
  #pin[hidden] { display: none; }
  #pin svg { width: 100%; height: 100%; }
  #pin { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -42px 0 0 -22px; pointer-events: none; }
  #recenter { position: absolute; bottom: 34px; right: 10px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); display: none; align-items: center; justify-content: center; padding: 0; }
</style>
</head>
<body>
<div id="map"></div>
<div id="pin" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#CB6845" stroke="#fff" stroke-width="1" d="M12 1.5c-4.1 0-7.5 3.2-7.5 7.3 0 5.5 7.5 13.7 7.5 13.7s7.5-8.2 7.5-13.7c0-4.1-3.4-7.3-7.5-7.3zm0 10a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z"/></svg></div>
<button id="recenter" type="button"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<script type="module">
const send = message => window.ReactNativeWebView?.postMessage(JSON.stringify(message));
let config;
try { config = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch { send({ type: 'failed' }); throw new Error('bad config'); }
const C = config.colors ?? { forest: '#12342A', olive: '#34765A', clay: '#CB6845', blue: '#2F5E8C' }; // palette from src/ui.tsx

// Same helpers as src/map-math.ts (tests/map.test.mjs checks this copy against them).
const rad = d => d * Math.PI / 180;
function bearing(a, b) {
  const y = Math.sin(rad(b.longitude - a.longitude)) * Math.cos(rad(b.latitude));
  const x = Math.cos(rad(a.latitude)) * Math.sin(rad(b.latitude)) -
    Math.sin(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.cos(rad(b.longitude - a.longitude));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function ease(a, b, t) {
  const k = Math.min(1, Math.max(0, t));
  return { latitude: a.latitude + (b.latitude - a.latitude) * k, longitude: a.longitude + (b.longitude - a.longitude) * k };
}
function fitBounds(points) {
  const lats = points.map(p => p.latitude), lngs = points.map(p => p.longitude);
  let [w, e, s, n] = [Math.min(...lngs), Math.max(...lngs), Math.min(...lats), Math.max(...lats)];
  const pad = 0.005;
  if (e - w < 2 * pad) { const m = (w + e) / 2; w = m - pad; e = m + pad; }
  if (n - s < 2 * pad) { const m = (s + n) / 2; s = m - pad; n = m + pad; }
  return [[w, s], [e, n]];
}
const labelField = language => language === 'ar'
  ? ['coalesce', ['get', 'name:ar'], ['get', 'name:en'], ['get', 'name:latin'], ['get', 'name']]
  : ['coalesce', ['get', 'name:en'], ['get', 'name:latin'], ['get', 'name']];
// End of helpers.

const timer = setTimeout(() => send({ type: 'failed' }), 12000); // style never arrived: blocked or offline
let ml;
try { ml = await import('/vendor/maplibre-6.12.0/maplibre-gl.mjs'); }
catch (e) { clearTimeout(timer); send({ type: 'failed' }); throw e; }
ml.setRTLTextPlugin('/vendor/mapbox-gl-rtl-text.js', true).catch(() => undefined);

const pin = config.mode === 'pin';
const points = pin ? [config.center] : [config.pickup, config.dropoff, ...(config.driver ? [config.driver] : [])];
const padding = config.padding ?? 0;
const map = new ml.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', bounds: fitBounds(points),
  fitBoundsOptions: { padding, maxZoom: 15 }, attributionControl: { compact: true },
  dragRotate: false, pitchWithRotate: false, maxZoom: 18,
  // The WebView only receives touches the app's scroll view lets through; inside it the map owns them.
});
map.touchZoomRotate.disableRotation();

const state = { driver: null, road: null, approach: null, focus: undefined };
let ready = false, moved = false, marker, arrow, shown, frame;
window.wind = update => { Object.assign(state, update); if (ready) draw(); };

function dot(color, square) {
  const el = document.createElement('div');
  el.style.cssText = `width:18px;height:18px;border-radius:${square ? 5 : 9}px;background:${color};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)`;
  return el;
}
function driverIcon(withArrow) {
  const el = document.createElement('div');
  el.innerHTML = `<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="15" fill="${C.blue}" stroke="#fff" stroke-width="3"/>${
    withArrow ? '<path d="M19 9 L26 26 L19 22 L12 26 Z" fill="#fff"/>' : '<circle cx="19" cy="19" r="5" fill="#fff"/>'}</svg>`;
  el.style.cssText = 'width:38px;height:38px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))';
  return el;
}
const halo = (meters, lat) => {
  const base = meters / (156543.03 * Math.cos(lat * Math.PI / 180));
  return ['interpolate', ['exponential', 2], ['zoom'], 0, base, 22, base * 2 ** 22];
};
const empty = { type: 'FeatureCollection', features: [] };
const nextStops = () => state.focus === 'pickup' ? [config.pickup] : state.focus === 'dropoff' ? [config.dropoff] : [config.pickup, config.dropoff];
const recenter = document.getElementById('recenter');
recenter.setAttribute('aria-label', config.recenter ?? 'Recenter');
recenter.style.color = C.blue;
document.querySelector('#pin path').setAttribute('fill', C.clay);

map.once('style.load', () => { // style parsed: draw now, tiles stream in after
  ready = true;
  clearTimeout(timer);
  for (const layer of map.getStyle().layers)
    if (layer.type === 'symbol' && JSON.stringify(layer.layout?.['text-field'] ?? '').includes('name'))
      map.setLayoutProperty(layer.id, 'text-field', labelField(config.language));
  map.once('load', () => document.querySelector('.maplibregl-compact-show')?.classList.remove('maplibregl-compact-show'));
  if (pin) {
    document.getElementById('pin').hidden = false;
    map.jumpTo({ center: [config.center.longitude, config.center.latitude], zoom: 16 });
    map.on('moveend', () => { const p = map.getCenter(); send({ type: 'center', latitude: p.lat, longitude: p.lng }); });
  } else {
    new ml.Marker({ element: dot(C.olive) }).setLngLat([config.pickup.longitude, config.pickup.latitude]).addTo(map);
    new ml.Marker({ element: dot(C.clay, true) }).setLngLat([config.dropoff.longitude, config.dropoff.latitude]).addTo(map);
    // Lines follow roads only (OSRM geometry); never a straight pickup→dropoff line.
    for (const [id, color] of [['road', C.forest], ['approach', C.blue]]) {
      map.addSource(id, { type: 'geojson', data: empty });
      map.addLayer({ id, type: 'line', source: id, layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': color, 'line-width': id === 'road' ? 4 : 5, 'line-opacity': id === 'road' ? 0.85 : 0.9 } });
    }
    map.addSource('accuracy', { type: 'geojson', data: empty });
    map.addLayer({ id: 'accuracy', type: 'circle', source: 'accuracy', paint: { 'circle-color': C.blue, 'circle-opacity': 0.12,
      'circle-stroke-color': C.blue, 'circle-stroke-opacity': 0.3, 'circle-stroke-width': 1 } });
    const userMoved = () => { moved = true; recenter.style.display = 'flex'; };
    map.on('dragstart', userMoved);
    map.on('zoomstart', e => { if (e.originalEvent) userMoved(); });
    recenter.onclick = () => { moved = false; recenter.style.display = 'none'; refit(); };
    // The WebView can lay out after the map is created (a 150 px booking preview framed nothing): frame again at real size.
    addEventListener('resize', () => { if (!moved) refit(0); });
    map.resize(); refit(0);
    draw();
  }
  send({ type: 'ready' });
});

let drawnLines = '', drawnDriver = '';
// Live: driver and next stop. Otherwise the whole road route (it can bend outside the two pins), or the pins.
function refit(duration) {
  const road = state.road?.map(([longitude, latitude]) => ({ latitude, longitude }));
  map.fitBounds(fitBounds(state.driver ? [state.driver, ...nextStops()] : road ?? [config.pickup, config.dropoff]),
    { padding, maxZoom: 16, ...(duration === 0 && { duration: 0 }) });
}
function draw() {
  if (pin) return;
  const linesKey = [state.road, state.approach].map(l => l ? `${l.length}:${l[0]}:${l[l.length - 1]}` : '').join('|');
  if (linesKey !== drawnLines) {
    drawnLines = linesKey;
    for (const id of ['road', 'approach'])
      map.getSource(id).setData(state[id] ? { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: state[id] } } : empty);
    if (!moved && !state.driver && state.road) refit();
  }
  const driver = state.driver;
  const key = driver ? `${driver.latitude},${driver.longitude},${driver.heading},${driver.accuracy}` : '';
  if (key === drawnDriver) return;
  drawnDriver = key;
  const source = map.getSource('accuracy');
  if (!driver) {
    marker?.remove(); marker = undefined; shown = undefined;
    source.setData(empty);
    return;
  }
  // Glide from the shown position to the new fix instead of jumping every poll.
  const target = { latitude: driver.latitude, longitude: driver.longitude };
  const from = shown;
  const moving = from && Math.abs(from.latitude - target.latitude) + Math.abs(from.longitude - target.longitude) > 0.0001;
  const rotation = driver.heading ?? (moving ? bearing(from, target) : null);
  if (!marker || arrow !== (rotation !== null)) {
    marker?.remove();
    marker = new ml.Marker({ element: driverIcon(rotation !== null), rotationAlignment: 'map' })
      .setLngLat([(from ?? target).longitude, (from ?? target).latitude]).addTo(map);
    arrow = rotation !== null;
  }
  if (rotation !== null) marker.setRotation(rotation);
  source.setData(driver.accuracy ? { type: 'Feature', geometry: { type: 'Point', coordinates: [target.longitude, target.latitude] }, properties: {} } : empty);
  if (driver.accuracy) map.setPaintProperty('accuracy', 'circle-radius', halo(driver.accuracy, target.latitude));
  if (frame) cancelAnimationFrame(frame);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches || config.still;
  const start = performance.now(), origin = from ?? target;
  const step = t => {
    const k = still ? 1 : (t - start) / 1200;
    const p = ease(origin, target, k);
    marker?.setLngLat([p.longitude, p.latitude]);
    shown = p;
    if (k < 1) frame = requestAnimationFrame(step);
  };
  frame = requestAnimationFrame(step);
  if (!moved) map.fitBounds(fitBounds([target, ...nextStops()]), { padding, maxZoom: 16, duration: still ? 0 : 800 });
}
</script>
</body>
</html>
