<div id="map"></div>
<div id="pin-base" hidden></div>

  map.addLayer({ id: 'approach', type: 'line', source: 'approach', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': C.blue, 'line-width': 5 } });
  map.addSource('accuracy', { type: 'geojson', data: empty });
  map.addLayer({ id: 'accuracy', type: 'circle', source: 'accuracy', paint: { 'circle-color': C.blue, 'circle-opacity': 0.12,
    'circle-stroke-color': C.blue, 'circle-stroke-opacity': 0.3, 'circle-stroke-width': 1 } });
  map.addSource('user-accuracy', { type: 'geojson', data: empty });
  map.addLayer({ id: 'user-accuracy', type: 'circle', source: 'user-accuracy', paint: { 'circle-color': '#2F6FED', 'circle-opacity': 0.12,
    'circle-stroke-color': '#2F6FED', 'circle-stroke-opacity': 0.25, 'circle-stroke-width': 1 } });
  map.on('movestart', () => { if (pinning()) { pinEl.classList.add('lift'); send({ type: 'moving' }); } });
  map.on('dragstart', () => { if (pinning()) send({ type: 'gesture' }); else userMoved(); });
  map.on('zoomstart', e => { if (e.originalEvent) { if (pinning()) send({ type: 'gesture' }); else userMoved(); } });
  map.on('click', e => {
    if (!pinning()) return;
    send({ type: 'gesture' });
    // A tap on the pin's own spot moves nothing, so no moveend reports it: report the centre here or Confirm stays waiting.
    if (!centerPin({ latitude: e.lngLat.lat, longitude: e.lngLat.lng })) { const p = map.getCenter(); send({ type: 'center', latitude: p.lat, longitude: p.lng }); }
  });
  map.on('moveend', () => {
    if (!pinning()) return;
    pinEl.classList.remove('lift');
    const p = map.getCenter();
    send({ type: 'center', latitude: p.lat, longitude: p.lng });
  });
  const userMoved = () => { if (state.mode === 'route') { moved = true; recenter.style.display = 'flex'; } };
  recenter.onclick = () => {
    moved = false; recenter.style.display = 'none';
    const car = shown ?? state.driver;
    drawnDriver = ''; // the next draw reframes
    if (car && state.follow) map.easeTo({ center: [car.longitude, car.latitude], zoom: FOLLOW_ZOOM + 1, offset: followOffset(), duration: still() ? 0 : 800 });
    else if (car) drawDriver();
    else refit(still() ? 0 : 800);
  };
  // The WebView can lay out after the map is created (a 150 px booking preview framed nothing): frame again at real size.
  addEventListener('resize', () => { if (state.mode === 'route' && !moved) refit(0); });
  map.resize();
  applyMode();
  if (pinning()) { const p = map.getCenter(); send({ type: 'center', latitude: p.lat, longitude: p.lng }); }
  draw(); drawUser(); fade();
});

const followOffset = () => [((state.insets.left ?? 0) - (state.insets.right ?? 0)) / 2, (state.insets.top - state.insets.bottom) / 2 - 40];
let drawnLines = '', drawnDriver = '', drawnClosed = '', framed = '', closedMarkers = [];
// Live: driver, next stop and the road to it. Otherwise both pins and the whole road route (it can bend outside them).
const framePoints = () => routeFramePoints(state);
function refit(duration) {
  if (state.mode !== 'route' || state.driver) return; // the car is on screen: the camera follows it, it does not frame the stops
  const points = framePoints().filter(validPoint);
  if (!points.length) return;
  framed = JSON.stringify(points);
  // A sheet taller than the map would make an impossible frame; keep at least a strip of map to fit into.
  const box = fitPadding(), height = mapEl.clientHeight || 300, spare = height - box.top - box.bottom;
  if (spare < 80) { const cut = (80 - spare) / 2; box.bottom = Math.max(0, box.bottom - cut * 2); }
  map.fitBounds(fitBounds(points), { padding: box, maxZoom: 16, ...(duration != null && { duration }) });
}
function draw(insetsChanged = false) {
  if (free()) { drawDriver(); return; }
  const linesKey = JSON.stringify([state.road, state.approach]); // every point: a reroute can keep its length and ends
  if (linesKey !== drawnLines) {
    drawnLines = linesKey;
    for (const id of ['road', 'approach']) {
      const line = id === 'approach' && state.approach && shown ? [[shown.longitude, shown.latitude], ...state.approach] : state[id];
      map.getSource(id).setData(line ? { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: line } } : empty);
    }
  }
  // With a car on the road, the trip ahead steps back so the live line reads first.
  map.setPaintProperty('road', 'line-opacity', state.driver ? 0.3 : 1);
  map.setPaintProperty('road-casing', 'line-opacity', state.driver ? 0.3 : 1);
  const closedKey = (state.closed ?? []).map(p => `${p.latitude},${p.longitude}`).join('|');
  if (closedKey !== drawnClosed) {
    drawnClosed = closedKey;
    closedMarkers.forEach(m => m.remove());
    closedMarkers = (state.closed ?? []).map(p => new ml.Marker({ element: noEntry() }).setLngLat([p.longitude, p.latitude]).addTo(map));
  }
  drawStops();
  drawDriver();
  if (!moved && (insetsChanged || JSON.stringify(framePoints()) !== framed)) refit(still() ? 0 : 800);
}
function drawUser() {
  const user = validPoint(state.user) ? state.user : null;
  const source = map.getSource('user-accuracy');
  if (!user) { userMarker?.remove(); userMarker = undefined; source?.setData(empty); return; }
  if (!userMarker) {
    const el = document.createElement('div');
    el.className = 'user-dot';
    el.style.cssText = 'width:16px;height:16px;box-sizing:border-box;border-radius:8px;background:#2F6FED;border:3px solid #fff;box-shadow:0 0 0 1px rgba(47,111,237,.25),0 1px 4px rgba(0,0,0,.35)';
    userMarker = new ml.Marker({ element: el });
    userMarker.setLngLat([user.longitude, user.latitude]).addTo(map);
  }
  userMarker.setLngLat([user.longitude, user.latitude]);
  source?.setData(user.accuracy != null ? { type: 'Feature', geometry: { type: 'Point', coordinates: [user.longitude, user.latitude] }, properties: {} } : empty);
  if (user.accuracy != null) map.setPaintProperty('user-accuracy', 'circle-radius', halo(user.accuracy, user.latitude));
}
function drawDriver() {
  const driver = !free() ? state.driver : null;
  const key = driver ? `${driver.latitude},${driver.longitude},${driver.heading},${driver.accuracy},${state.focus}` : '';
  if (key === drawnDriver) return;
  drawnDriver = key;
  const source = map.getSource('accuracy');
  if (!driver) {
    if (frame) cancelAnimationFrame(frame); // a glide still running would bring back the old position
    marker?.remove(); marker = undefined; shown = undefined; at = undefined; turned = undefined;
    source.setData(empty);
    return;
  }
  // Glide to each new fix over the gap between fixes (still moving when the next lands), turn smoothly,
  // and keep the approach line starting under the marker.
  const target = { latitude: driver.latitude, longitude: driver.longitude };
  const from = shown;
  const moving = from && Math.abs(from.latitude - target.latitude) + Math.abs(from.longitude - target.longitude) > 0.0001;
  const rotation = driver.heading ?? (moving ? bearing(from, target) : null);
  if (!marker || arrow !== (rotation !== null)) {
    marker?.remove();
    marker = new ml.Marker({ element: driverIcon(rotation !== null), rotationAlignment: 'map' })
      .setLngLat([(from ?? target).longitude, (from ?? target).latitude]).addTo(map);
    arrow = rotation !== null; turned = undefined;
  }
  const turnFrom = turned ?? rotation;
  const snap = !!from && farJump(from, target);
  const origin = snap ? target : from ?? target;
  source.setData(driver.accuracy != null ? { type: 'Feature', geometry: { type: 'Point', coordinates: [origin.longitude, origin.latitude] }, properties: {} } : empty);
  if (driver.accuracy != null) map.setPaintProperty('accuracy', 'circle-radius', halo(driver.accuracy, target.latitude));
  if (frame) cancelAnimationFrame(frame);
  const start = performance.now(), instant = still();
  const span = snap ? 0 : glideMs(at === undefined ? 0 : start - at);
  at = start;
  // The camera rides along with the car over the same span. Someone waiting sees the car and the next stop together;
  // a driver sees the street ahead (`follow`), and a car close to its stop never zooms in past street level.
  if (!moved) {
    const stop = state.focus === 'pickup' ? state.pickup : state.focus === 'dropoff' ? state.dropoff : null;
    if (!state.follow && validPoint(stop)) {
      map.fitBounds(fitBounds([target, stop]), { padding: { ...fitPadding(), top: state.insets.top + Math.max(padding, 70), bottom: state.insets.bottom + Math.max(padding, 40) }, maxZoom: FOLLOW_ZOOM + 1, duration: instant ? 0 : span, easing: t => t });
    } else map.easeTo({ center: [target.longitude, target.latitude], zoom: FOLLOW_ZOOM + 1, offset: followOffset(), duration: instant ? 0 : span, easing: t => t });
  }
  const step = t => {
    const k = instant ? 1 : (t - start) / span;
    const p = ease(origin, target, k);
    marker?.setLngLat([p.longitude, p.latitude]);
    if (rotation !== null) marker?.setRotation(turned = turn(turnFrom, rotation, instant ? 1 : (t - start) / 500));
    shown = p;
    if (state.approach?.length && !state.stale && (k >= 1 || t - lineAt > 100)) { // ~10 line redraws a second is smooth and cheap
      lineAt = t;
      map.getSource('approach').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[p.longitude, p.latitude], ...state.approach] } });
    }
    // The halo belongs to the drawn car, not to the raw fix: it must not jump ahead of the marker.
    if (driver.accuracy != null && (k >= 1 || t - haloAt > 100)) {
      haloAt = t;
      source.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.longitude, p.latitude] }, properties: {} });
    }
    if (k < 1) frame = requestAnimationFrame(step);
  };
  frame = requestAnimationFrame(step);
}
</script>
</body>
</html>
