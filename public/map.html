<!doctype html>
<!-- Android app map (SPEC-android-map.md): the APK has no Google Maps key, so src/route-map.android.tsx shows this page
     in a WebView. Same MapLibre + OpenFreeMap setup as src/route-map.tsx (web); keep the two in step.
     Input: JSON in the URL fragment (never sent to the server), then window.wind({driver, road, focus}) updates.
     Output: ReactNativeWebView.postMessage of {type: 'ready' | 'failed'} and, in pin mode, {type: 'center', latitude, longitude}. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/vendor/maplibre-6.12.0/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #E6ECE3; }
  #pin[hidden] { display: none; }
  #pin svg { width: 100%; height: 100%; }
  #pin { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -42px 0 0 -22px; pointer-events: none; }
  #recenter { position: absolute; bottom: 34px; inset-inline-end: 10px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); display: none; align-items: center; justify-content: center; padding: 0; }
</style>
</head>
<body>
<div id="map"></div>
<div id="pin" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#CB6845" stroke="#fff" stroke-width="1" d="M12 1.5c-4.1 0-7.5 3.2-7.5 7.3 0 5.5 7.5 13.7 7.5 13.7s7.5-8.2 7.5-13.7c0-4.1-3.4-7.3-7.5-7.3zm0 10a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z"/></svg></div>
<button id="recenter" type="button"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<script type="module">
const send = message => window.ReactNativeWebView?.postMessage(JSON.stringify(message));
let config;
try { config = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch { send({ type: 'failed' }); throw new Error('bad config'); }
// A missing/empty fragment used to throw on config.colors and leave a blank WebView; tell the app to fall back.
if (!config || typeof config !== 'object') { send({ type: 'failed' }); throw new Error('bad config'); }
const defaultColors = { forest: '#12342A', olive: '#34765A', clay: '#CB6845', blue: '#2F5E8C' }; // palette from src/ui.tsx
// The public page can be opened with an arbitrary URL fragment. These values
// reach SVG markup and CSS, so accept only the app's six-digit hex colors.
const incomingColors = config.colors && typeof config.colors === 'object' && !Array.isArray(config.colors) ? config.colors : {};
const C = Object.fromEntries(Object.entries(defaultColors).map(([key, fallback]) => [key,
  typeof incomingColors[key] === 'string' && incomingColors[key].length === 7 && /^#[0-9a-f]{6}$/i.test(incomingColors[key]) ? incomingColors[key] : fallback]));
// The live camera: the car is centred at street level (Uber keeps it in the middle, not zoomed in and out).
const FOLLOW_ZOOM = 15, FOLLOW_OFFSET = [0, -60];

// Same helpers as src/map-math.ts (tests/map.test.mjs checks this copy against them).
const rad = d => d * Math.PI / 180;
const MERCATOR_LATITUDE_LIMIT = 85.05112878;
function metersPerPixelAtCoordinate(latitude, zoom, density = 1) {
  if (![latitude, zoom, density].every(Number.isFinite) || density <= 0) throw new RangeError('invalid_map_resolution');
  const clamped = Math.max(-MERCATOR_LATITUDE_LIMIT, Math.min(MERCATOR_LATITUDE_LIMIT, latitude));
  const resolution = Math.cos(rad(clamped)) * 2 * Math.PI * 6378137 / (2 ** zoom * 512 * density);
  if (!Number.isFinite(resolution) || resolution <= 0) throw new RangeError('invalid_map_resolution');
  return resolution;
}
function bearing(a, b) {
  const y = Math.sin(rad(b.longitude - a.longitude)) * Math.cos(rad(b.latitude));
  const x = Math.cos(rad(a.latitude)) * Math.sin(rad(b.latitude)) -
    Math.sin(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.cos(rad(b.longitude - a.longitude));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function ease(a, b, t) {
  const k = Math.min(1, Math.max(0, t));
  return { latitude: a.latitude + (b.latitude - a.latitude) * k, longitude: a.longitude + (b.longitude - a.longitude) * k };
}
function fitBounds(points) {
  const lats = points.map(p => p.latitude), lngs = points.map(p => p.longitude);
  let [w, e, s, n] = [Math.min(...lngs), Math.max(...lngs), Math.min(...lats), Math.max(...lats)];
  const pad = 0.005;
  if (e - w < 2 * pad) { const m = (w + e) / 2; w = m - pad; e = m + pad; }
  if (n - s < 2 * pad) { const m = (s + n) / 2; s = m - pad; n = m + pad; }
  return [[w, s], [e, n]];
}
const glideMs = gap => gap > 0 && gap <= 6000 ? Math.max(600, gap) : 1200;
const farJump = (a, b) => Math.abs(a.latitude - b.latitude) + Math.abs(a.longitude - b.longitude) > 0.018;
function turn(a, b, t) {
  const d = ((b - a) % 360 + 540) % 360 - 180;
  return (a + d * Math.min(1, Math.max(0, t)) + 360) % 360;
}
function routeFramePoints({ pickup, dropoff, driver, focus, road, approach }) {
  const stops = focus === 'pickup' ? [pickup] : focus === 'dropoff' ? [dropoff] : [pickup, dropoff];
  const line = driver ? approach : road;
  return [
    ...(driver ? [driver, ...stops] : [pickup, dropoff]),
    ...(line ?? []).map(([longitude, latitude]) => ({ latitude, longitude })),
  ];
}
const labelField = language => language === 'ar'
  ? ['coalesce', ['get', 'name:ar'], ['get', 'name:en'], ['get', 'name:latin'], ['get', 'name']]
  : ['coalesce', ['get', 'name:en'], ['get', 'name:latin'], ['get', 'name']];
// End of helpers.

let failed = false;
const fail = () => { if (!failed) { failed = true; send({ type: 'failed' }); } };
const readyTimeout = Number.isSafeInteger(config.readyTimeout) && config.readyTimeout >= 5000 && config.readyTimeout <= 30000 ? config.readyTimeout : 20000;
let timer = setTimeout(fail, readyTimeout); // map never became usable: blocked or offline
let ml;
try { ml = await import('/vendor/maplibre-6.12.0/maplibre-gl.mjs'); }
catch (e) { clearTimeout(timer); fail(); throw e; }
ml.setRTLTextPlugin('/vendor/mapbox-gl-rtl-text.js', true).catch(() => undefined);

const pin = config.mode === 'pin';
const points = pin ? [config.center] : [config.pickup, config.dropoff, ...(config.driver ? [config.driver] : [])];
const padding = config.padding ?? 0;
const map = new ml.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', bounds: fitBounds(points),
  fitBoundsOptions: { padding, maxZoom: 15 }, attributionControl: { compact: true },
  dragRotate: false, pitchWithRotate: false, maxZoom: 18,
  // The WebView only receives touches the app's scroll view lets through; inside it the map owns them.
});
map.touchZoomRotate.disableRotation();
map.on('webglcontextlost', fail); // a lost GPU context never draws again; the app retries
let mapLoaded = false, baseTileLoaded = false, announcedReady = false;
const announceReady = () => {
  if (failed || !mapLoaded || !baseTileLoaded || announcedReady) return;
  announcedReady = true;
  clearTimeout(timer);
  document.querySelector('.maplibregl-compact-show')?.classList.remove('maplibregl-compact-show');
  send({ type: 'ready' });
};
// MapLibre can emit load even when every vector source request failed. Require
// an actual basemap tile, not a GeoJSON overlay, before enabling the pin.
map.on('sourcedata', e => {
  if (e.source?.type === 'vector' && e.coord && e.tile?.state === 'loaded') { baseTileLoaded = true; announceReady(); }
});
map.once('load', () => { mapLoaded = true; announceReady(); });

const state = { driver: config.driver ?? null, road: null, approach: null, closed: [], focus: undefined };
let ready = false, moved = false, marker, arrow, shown, frame, at, turned, lineAt = 0, haloAt = 0;
window.wind = update => {
  if (failed) return;
  Object.assign(state, update);
  if (ready) {
    if (pin && update.center) centerPin(update.center);
    else draw();
  }
  fade();
};
function centerPin(point) {
  if (!point || !Number.isFinite(point.latitude) || !Number.isFinite(point.longitude)
    || Math.abs(point.latitude) > 90 || Math.abs(point.longitude) > 180) return;
  const current = map.getCenter();
  if (Math.abs(current.lat - point.latitude) + Math.abs(current.lng - point.longitude) > 0.000001)
    map.jumpTo({ center: [point.longitude, point.latitude] });
}
// Faded while the fix is old (lost signal): "last seen here", not live. The approach line goes with it: there is no
// road left to follow, and a bright line would read as live.
const fade = () => {
  if (marker) marker.getElement().style.opacity = state.stale ? '0.45' : '';
  if (!ready) return;
  if (map.getLayer('accuracy')) map.setPaintProperty('accuracy', 'circle-opacity', state.stale ? 0.05 : 0.12);
  const approach = map.getSource('approach');
  if (approach) {
    const line = state.approach && shown ? [[shown.longitude, shown.latitude], ...state.approach] : state.approach;
    approach.setData(state.stale || !line?.length ? empty : { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: line } });
  }
};

function dot(color, square) {
  const el = document.createElement('div');
  el.style.cssText = `width:18px;height:18px;border-radius:${square ? 5 : 9}px;background:${color};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)`;
  return el;
}
function noEntry() { // closed checkpoint, same sign as the web map
  const el = document.createElement('div');
  el.innerHTML = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="#C62828" stroke="#fff" stroke-width="2"/><rect x="5.5" y="9.5" width="11" height="3" rx="1" fill="#fff"/></svg>';
  el.style.cssText = 'width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))';
  return el;
}
function driverIcon(withArrow) {
  const el = document.createElement('div');
  el.classList.add('driver-marker');
  el.innerHTML = `<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="15" fill="${C.blue}" stroke="#fff" stroke-width="3"/>${
    withArrow ? '<path d="M19 9 L26 26 L19 22 L12 26 Z" fill="#fff"/>' : '<circle cx="19" cy="19" r="5" fill="#fff"/>'}</svg>`;
  el.style.cssText = 'width:38px;height:38px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))';
  return el;
}
const halo = (meters, lat) => {
  const base = meters / metersPerPixelAtCoordinate(lat, 0); // WebView map circles use CSS pixels, not physical screen pixels.
  return ['interpolate', ['exponential', 2], ['zoom'], 0, base, 22, base * 2 ** 22];
};
const empty = { type: 'FeatureCollection', features: [] };
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches || config.still;
const recenter = document.getElementById('recenter');
document.documentElement.dir = config.language === 'ar' ? 'rtl' : 'ltr';
recenter.setAttribute('aria-label', config.recenter ?? 'Recenter');
recenter.style.color = C.blue;
document.querySelector('#pin path').setAttribute('fill', C.clay);

map.once('style.load', () => { // style parsed: draw now, tiles stream in after
  ready = true;
  // The style is parsed; keep the deadline until the map's first load completes.
  send({ type: 'drawing' });
  for (const layer of map.getStyle().layers)
    if (layer.type === 'symbol' && JSON.stringify(layer.layout?.['text-field'] ?? '').includes('name'))
      map.setLayoutProperty(layer.id, 'text-field', labelField(config.language));
  if (pin) {
    document.getElementById('pin').hidden = false;
    map.jumpTo({ center: [config.center.longitude, config.center.latitude], zoom: 16 });
    if (state.center) centerPin(state.center);
    map.on('dragstart', () => send({ type: 'gesture' }));
    map.on('zoomstart', e => { if (e.originalEvent) send({ type: 'gesture' }); });
    map.on('moveend', () => { const p = map.getCenter(); send({ type: 'center', latitude: p.lat, longitude: p.lng }); });
    const p = map.getCenter(); send({ type: 'center', latitude: p.lat, longitude: p.lng });
  } else {
    new ml.Marker({ element: dot(C.olive) }).setLngLat([config.pickup.longitude, config.pickup.latitude]).addTo(map);
    new ml.Marker({ element: dot(C.clay, true) }).setLngLat([config.dropoff.longitude, config.dropoff.latitude]).addTo(map);
    // Lines follow roads only (OSRM geometry); never a straight pickup→dropoff line.
    for (const [id, color] of [['road', C.forest], ['approach', C.blue]]) {
      map.addSource(id, { type: 'geojson', data: empty });
      map.addLayer({ id, type: 'line', source: id, layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': color, 'line-width': id === 'road' ? 4 : 5, 'line-opacity': id === 'road' ? 0.85 : 0.9 } });
    }
    map.addSource('accuracy', { type: 'geojson', data: empty });
    map.addLayer({ id: 'accuracy', type: 'circle', source: 'accuracy', paint: { 'circle-color': C.blue, 'circle-opacity': 0.12,
      'circle-stroke-color': C.blue, 'circle-stroke-opacity': 0.3, 'circle-stroke-width': 1 } });
    const userMoved = () => { moved = true; recenter.style.display = 'flex'; };
    map.on('dragstart', userMoved);
    map.on('zoomstart', e => { if (e.originalEvent) userMoved(); });
    recenter.onclick = () => {
      moved = false; recenter.style.display = 'none';
      const car = shown ?? state.driver;
      if (car) map.easeTo({ center: [car.longitude, car.latitude], zoom: FOLLOW_ZOOM, offset: FOLLOW_OFFSET, duration: still() ? 0 : 800 });
      else refit(still() ? 0 : 800);
    };
    // The WebView can lay out after the map is created (a 150 px booking preview framed nothing): frame again at real size.
    addEventListener('resize', () => { if (!moved) refit(0); });
    map.resize(); refit(0);
    draw(); fade();
  }
});

let drawnLines = '', drawnDriver = '', drawnClosed = '', framed = '', closedMarkers = [];
// Live: driver, next stop and the road to it. Otherwise both pins and the whole road route (it can bend outside them).
const framePoints = () => routeFramePoints({ ...state, pickup: config.pickup, dropoff: config.dropoff });
function refit(duration) {
  if (state.driver) return; // the car is on screen: the camera follows it, it does not frame the stops
  const points = framePoints();
  framed = JSON.stringify(points);
  map.fitBounds(fitBounds(points), { padding, maxZoom: 16, ...(duration != null && { duration }) });
}
function draw() {
  if (pin) return;
  const linesKey = JSON.stringify([state.road, state.approach]); // every point: a reroute can keep its length and ends
  if (linesKey !== drawnLines) {
    drawnLines = linesKey;
    for (const id of ['road', 'approach']) {
      const line = id === 'approach' && state.approach && shown ? [[shown.longitude, shown.latitude], ...state.approach] : state[id];
      map.getSource(id).setData(line ? { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: line } } : empty);
    }
  }
  const closedKey = (state.closed ?? []).map(p => `${p.latitude},${p.longitude}`).join('|');
  if (closedKey !== drawnClosed) {
    drawnClosed = closedKey;
    closedMarkers.forEach(m => m.remove());
    closedMarkers = (state.closed ?? []).map(p => new ml.Marker({ element: noEntry() }).setLngLat([p.longitude, p.latitude]).addTo(map));
  }
  drawDriver();
  if (!moved && JSON.stringify(framePoints()) !== framed) refit(still() ? 0 : 800);
}
function drawDriver() {
  const driver = state.driver;
  const key = driver ? `${driver.latitude},${driver.longitude},${driver.heading},${driver.accuracy},${state.focus}` : '';
  if (key === drawnDriver) return;
  drawnDriver = key;
  const source = map.getSource('accuracy');
  if (!driver) {
    if (frame) cancelAnimationFrame(frame); // a glide still running would bring back the old position
    marker?.remove(); marker = undefined; shown = undefined; at = undefined; turned = undefined;
    source.setData(empty);
    return;
  }
  // Glide to each new fix over the gap between fixes (still moving when the next lands), turn smoothly,
  // and keep the approach line starting under the marker.
  const target = { latitude: driver.latitude, longitude: driver.longitude };
  const from = shown;
  const moving = from && Math.abs(from.latitude - target.latitude) + Math.abs(from.longitude - target.longitude) > 0.0001;
  const rotation = driver.heading ?? (moving ? bearing(from, target) : null);
  if (!marker || arrow !== (rotation !== null)) {
    marker?.remove();
    marker = new ml.Marker({ element: driverIcon(rotation !== null), rotationAlignment: 'map' })
      .setLngLat([(from ?? target).longitude, (from ?? target).latitude]).addTo(map);
    arrow = rotation !== null; turned = undefined;
  }
  const turnFrom = turned ?? rotation;
  const snap = !!from && farJump(from, target);
  const origin = snap ? target : from ?? target;
  source.setData(driver.accuracy != null ? { type: 'Feature', geometry: { type: 'Point', coordinates: [origin.longitude, origin.latitude] }, properties: {} } : empty);
  if (driver.accuracy != null) map.setPaintProperty('accuracy', 'circle-radius', halo(driver.accuracy, target.latitude));
  if (frame) cancelAnimationFrame(frame);
  const start = performance.now(), instant = still();
  const span = snap ? 0 : glideMs(at === undefined ? 0 : start - at);
  at = start;
  // The camera rides along with the car over the same span: the map never zooms or jumps between fixes.
  if (!moved) map.easeTo({ center: [target.longitude, target.latitude], zoom: FOLLOW_ZOOM, offset: FOLLOW_OFFSET, duration: instant ? 0 : span });
  const step = t => {
    const k = instant ? 1 : (t - start) / span;
    const p = ease(origin, target, k);
    marker?.setLngLat([p.longitude, p.latitude]);
    if (rotation !== null) marker?.setRotation(turned = turn(turnFrom, rotation, instant ? 1 : (t - start) / 500));
    shown = p;
    if (state.approach?.length && !state.stale && (k >= 1 || t - lineAt > 100)) { // ~10 line redraws a second is smooth and cheap
      lineAt = t;
      map.getSource('approach').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[p.longitude, p.latitude], ...state.approach] } });
    }
    // The halo belongs to the drawn car, not to the raw fix: it must not jump ahead of the marker.
    if (driver.accuracy != null && (k >= 1 || t - haloAt > 100)) {
      haloAt = t;
      source.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.longitude, p.latitude] }, properties: {} });
    }
    if (k < 1) frame = requestAnimationFrame(step);
  };
  frame = requestAnimationFrame(step);
}
</script>
</body>
</html>
