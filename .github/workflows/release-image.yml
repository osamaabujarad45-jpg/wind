name: Release image

# Builds and pushes the API image to Azure Container Registry windpsacr. Deploying it stays a separate step on the VM: see
# docs/operations/deploy.md. No stored cloud secret: GitHub's OIDC token signs in as the wind-release-image app registration,
# whose federated credential trusts only this repository's master branch (immutable owner and repository ids) and whose
# only role is AcrPush on windpsacr.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, for example 20261115-azure1
        required: true

permissions:
  contents: read

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # only this job may ask GitHub for the token Azure trusts
    timeout-minutes: 30
    env:
      REGISTRY: windpsacr.azurecr.io
      IMAGE: windpsacr.azurecr.io/wind-api:${{ inputs.tag }}
      WIND_API_URL: ${{ vars.WIND_API_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag and the public address
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in ''|*[!A-Za-z0-9._-]*) echo "::error::bad image tag"; exit 1 ;; esac
          case "$WIND_API_URL" in https://*) ;; *) echo "::error::repository variable WIND_API_URL must be the https address"; exit 1 ;; esac
      - name: Log in
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 00b72f00-28cc-4bf3-9e1b-44356c93dcac
          tenant-id: 56c837d4-3f4a-4e92-b286-0fd734bf3b2a
          subscription-id: 7bd97ddb-84e5-4377-88b6-15902d94b6a8
      - run: az acr login --name windpsacr
      - name: Refuse a tag that exists
        # The VM deploys and rolls back by tag, so overwriting one would change what a rollback runs. Checking first fails
        # before a 10-minute build.
        run: |
          if result=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE already exists"
            exit 1
          fi
          case "$result" in
            *"no such manifest"*|*"manifest unknown"*|*"not found"*) ;;
            *) echo "::error::could not check $IMAGE: $result"; exit 1 ;;
          esac
      - name: Build
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --build-arg EXPO_PUBLIC_API_URL="$WIND_API_URL" --build-arg EXPO_PUBLIC_SUPPORT_WHATSAPP=972597127547 -t "$IMAGE" .
      - name: Push
        run: |
          docker push "$IMAGE"
          # The digest this registry holds for the image: exactly one entry for this repository, whatever the list order.
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" | grep "^${IMAGE%:*}@sha256:" || true)
          if [ "$(echo "$digest" | grep -c .)" != 1 ]; then
            echo "::error::expected one pushed digest for ${IMAGE%:*}, found: ${digest:-none}"
            exit 1
          fi
          echo "$IMAGE from $GITHUB_SHA: $digest" >> "$GITHUB_STEP_SUMMARY"
          # The VM runs the digest, not the tag: docs/operations/deploy.md.
          echo "Deploy: sudo /srv/deploy.sh ${IMAGE##*:} ${digest##*@} $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: |
          docker logout "$REGISTRY" || true
          az logout || true
