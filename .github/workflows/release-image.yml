name: Release image

# Builds and pushes the API image. Deploying it stays a separate step on the VM: see docs/operations/deploy.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, for example 20261107-pilot4
        required: true

permissions:
  contents: read

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: windprodacr.azurecr.io/wind-api:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: docker build --build-arg EXPO_PUBLIC_API_URL=https://windapi236.swedencentral.cloudapp.azure.com --build-arg EXPO_PUBLIC_SUPPORT_WHATSAPP=972597127547 -t "$IMAGE" .
      - name: Push
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login windprodacr.azurecr.io -u "$ACR_USERNAME" --password-stdin
          docker push "$IMAGE"
          docker logout windprodacr.azurecr.io
