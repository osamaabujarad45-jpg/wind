name: Release image

# Builds and pushes the API image. Deploying it stays a separate step on the VM: see docs/operations/deploy.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, for example 20261107-pilot4
        required: true

permissions:
  contents: read

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: windprodacr.azurecr.io/wind-api:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Log in
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | docker login windprodacr.azurecr.io -u "$ACR_USERNAME" --password-stdin
      - name: Refuse a tag that exists
        # The VM deploys and rolls back by tag, so overwriting one would change what a rollback runs.
        run: |
          if result=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE already exists"
            exit 1
          fi
          case "$result" in
            *"no such manifest"*|*"manifest unknown"*) ;;
            *) echo "::error::could not check $IMAGE: $result"; exit 1 ;;
          esac
      - name: Build
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --build-arg EXPO_PUBLIC_API_URL=https://windapi236.swedencentral.cloudapp.azure.com --build-arg EXPO_PUBLIC_SUPPORT_WHATSAPP=972597127547 -t "$IMAGE" .
      - name: Push
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "$IMAGE from $GITHUB_SHA: $digest" >> "$GITHUB_STEP_SUMMARY"
          # The VM runs the digest, not the tag: docs/operations/deploy.md.
          echo "Deploy: sudo /srv/deploy.sh ${IMAGE##*:} ${digest##*@} $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout windprodacr.azurecr.io
