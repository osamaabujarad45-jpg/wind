name: Uptime

# Outside the VM on purpose: the watchdog on the VM cannot report the VM itself being down.
# A failed run emails whoever last changed this schedule, under their GitHub notification settings.
# ponytail: hourly to stay inside the free Actions minutes; use a paid monitor when downtime must be seen sooner.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Production answers
        run: curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 30 --retry-all-errors "$WIND_API_URL/api/ready"
        env:
          WIND_API_URL: ${{ vars.WIND_API_URL }}
      - name: Map vector tile host serves a tile
        if: always() # the basemap is its own outage: report it even while the API is down
        run: |
          style=$(curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 15 --retry-all-errors https://tiles.openfreemap.org/styles/liberty)
          tilejson_url=$(printf '%s' "$style" | jq -er '.sources.openmaptiles.url')
          tilejson=$(curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 15 --retry-all-errors "$tilejson_url")
          template=$(printf '%s' "$tilejson" | jq -er '.tiles[0]')
          # A TileJSON can answer while tiles fail: fetch one real tile over Ramallah (z10).
          tile=$(printf '%s' "$template" | sed 's/{z}/10/; s/{x}/612/; s/{y}/416/')
          bytes=$(curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 15 --retry-all-errors -o /dev/null -w '%{size_download}' "$tile")
          test "$bytes" -gt 0
