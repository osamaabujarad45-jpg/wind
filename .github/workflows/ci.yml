name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fastship_test
          POSTGRES_DB: fastship_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U fastship_test -d fastship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WIND_TEST_DATABASE_URL: postgresql://fastship_test@127.0.0.1:55473/fastship_test
      BICEP_COMMAND: bicep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Install the pinned Bicep compiler
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bicep" --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Export release bundles for Android, iOS and web
        run: npx expo export --platform all --output-dir .expo/ci-release
        env:
          EXPO_PUBLIC_API_URL: https://windapi236.swedencentral.cloudapp.azure.com
          WIND_RELEASE: '1'
          WIND_LOCAL_TEST: '0'
          NODE_ENV: production

  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fastship_test
          POSTGRES_DB: fastship_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U fastship_test -d fastship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WIND_TEST_DATABASE_URL: postgresql://fastship_test@127.0.0.1:55473/fastship_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run test:persistence

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the release image without pushing it
        run: docker build --build-arg EXPO_PUBLIC_API_URL=https://ci.invalid -t wind:ci .
