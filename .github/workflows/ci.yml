name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fastship_test
          POSTGRES_DB: fastship_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U fastship_test -d fastship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WIND_TEST_DATABASE_URL: postgresql://fastship_test@127.0.0.1:55473/fastship_test
      BICEP_COMMAND: bicep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Install the pinned Bicep compiler
        run: |
          mkdir -p "$HOME/.local/bin"
          # nuget.org, not GitHub releases: the release CDN returned 502/503/504 to Actions for an hour on 8 Nov 2026.
          # The pin is the binary inside Microsoft's package, so a substituted download fails the check.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/bicep.nupkg" https://www.nuget.org/api/v2/package/Azure.Bicep.CommandLine.linux-x64/0.48.1
          unzip -q -o "$RUNNER_TEMP/bicep.nupkg" tools/bicep -d "$RUNNER_TEMP/bicep"
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  $RUNNER_TEMP/bicep/tools/bicep" | sha256sum --check
          install -m 755 "$RUNNER_TEMP/bicep/tools/bicep" "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bicep" --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:audit
      - name: Export release bundles for Android, iOS and web
        run: npx expo export --platform all --output-dir .expo/ci-release
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.WIND_API_URL }}
          WIND_RELEASE: '1'
          WIND_LOCAL_TEST: '0'
          NODE_ENV: production

  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: fastship_test
          POSTGRES_DB: fastship_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U fastship_test -d fastship_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WIND_TEST_DATABASE_URL: postgresql://fastship_test@127.0.0.1:55473/fastship_test
      # pg-import dumps and restores with the client tools; the runner's preinstalled client is 16 and pg_dump
      # refuses a newer server, so use the 18 client that matches the postgis/postgis:18 service.
      WIND_TEST_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install the PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-18
          "$WIND_TEST_PG_BIN/pg_dump" --version
      - run: npm ci
      - run: npm run test:persistence

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the release image without pushing it
        # app.config.js rejects reserved hosts (.invalid, .test, .example) for release builds, so CI builds
        # against the public production origin; the image is never pushed.
        run: docker build --build-arg EXPO_PUBLIC_API_URL="$WIND_API_URL" -t wind:ci .
        env:
          WIND_API_URL: ${{ vars.WIND_API_URL }}
