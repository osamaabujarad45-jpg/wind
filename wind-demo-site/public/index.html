(function () {

        pickupCity: 'bireh', dropoffCity: 'ramallah',
        pickupPoint: null, dropoffPoint: null,
        pickupNote: 'Warehouse gate', dropoffNote: 'Home', detail: 'Documents', option: 'small',
        loadingHelp: false, contact: '0599000782', pickupContact: '0599000782',

        price: 20, commission: null, status: 'cancelled', canChangeDestination: false,

        exceptionReason: null, safetyHold: false, safetyReport: null, dispute: null,
        customerName: 'Wind Demo', driverVehicle: null, driverPlate: null, driverLocation: null,

  }
  function save() { try { localStorage.setItem('wind-demo-state', JSON.stringify(state)); } catch (e) { /* private mode */ } }

  // Pre-seed a signed-in demo session on first load so the demo survives reloads.
  if (!state.token || !state.user) {
    state.token = 'demo-token-seed-' + Math.random().toString(36).slice(2);
    state.user = { id: 1, phone: '0599000782', name: 'Wind Demo', role: 'customer', status: 'active',
      vehicle: null, plate: null, rating: null, createdAt: nowMs() - 30 * 86400e3, email: 'demo@example.test',
      permanentlyApprovedAt: null, phoneVerifiedAt: null, emailVerifiedAt: null };
    save();
  }
  // Keep the app's auth keys consistent with the mock's session, unconditionally.
  try {
    localStorage.setItem('token', state.token);
    localStorage.setItem('onboarded', '1');
    if (!localStorage.getItem('language')) localStorage.setItem('language', 'en');
  } catch (e) { /* private mode */ }

  function nowMs() { return Date.now(); }
  function ok(payload, status) {
    return new Response(JSON.stringify(payload), {
      status: status || 200,
      headers: { 'content-type': 'application/json', 'x-demo': 'wind-demo' }

  }

    return { user: state.user, subscription: null, plan: null, settings: SETTINGS, capabilities: CAPABILITIES };
  }
  function priceFor(service) {
    if (service === 'freight') return { price: 186, km: 46.3, minutes: 62 };
    if (service === 'parcel') return { price: 20, km: 46.3, minutes: 56 };
    return { price: 66, km: 46.3, minutes: 56 };
  }
  function newOrder(payload) {
    var q = priceFor(payload.service);
    var price = typeof payload.quotedPrice === 'number' && payload.quotedPrice > 0 ? payload.quotedPrice : q.price;
    return {
      id: state.nextOrderId++, customerId: 1, driverId: null, service: payload.service, shared: false,
      pickupCity: payload.pickupCity, dropoffCity: payload.dropoffCity,
      pickupPoint: payload.pickupPoint || null, dropoffPoint: payload.dropoffPoint || null,
      pickupNote: String(payload.pickupNote || ''), dropoffNote: String(payload.dropoffNote || ''),
      detail: String(payload.detail || ''), option: String(payload.option || '1'),
      loadingHelp: !!payload.loadingHelp, contact: payload.contact || '0599000782',
      pickupContact: payload.contact || '0599000782',
      recipientName: '', recipientPhone: null,
      price: price, commission: null, status: 'searching', canChangeDestination: false,
      handoverCode: null, rating: null, createdAt: nowMs(), updatedAt: nowMs(),
      assignedAt: null, pickedUpAt: null, completedAt: null,
      sharing: false, scheduledFor: payload.scheduledFor || null, discount: 0, returnCode: null,
      exceptionReason: null, safetyHold: false, safetyReport: null, dispute: null,
      customerName: state.user ? state.user.name : 'Wind Demo',
      driverVehicle: null, driverPlate: null, driverLocation: null,
      recommendedPrice: null, priceRating: null, routeKm: null, sharedRun: false,
      myOffer: null, customerRating: null

  }
  function promote(order) {
    // A driver "finds" the ride ~25s after the request lands (searching -> assigned).
    if (order.status === 'searching' && nowMs() - order.createdAt > 25e3) {
      order.status = 'assigned';
      order.driverId = 900;
      order.assignedAt = order.createdAt + 25e3;
      order.driverVehicle = 'Car';
      order.driverPlate = '000-7';
      order.updatedAt = nowMs();

  }
  function findOrder(id) { return state.orders.find(function (o) { return o.id === id; }); }

  function handle(url, init) {

    var p = u.pathname.replace(/\/+$/, '');

    if (p === '/api/auth/options' && m === 'GET') return ok({ registrationOpen: true, emailReset: false });

        caps[k] = { state: 'unavailable', operationalEvidence: 'not_checked' };

    }

      var body = parseBody(init);
      if (p === '/api/auth/register') {
        if (!body.consent) return fail(400, 'consent_required');
        var name = String(body.name || 'Wind Demo').trim() || 'Wind Demo';
        state.user = { id: 1, phone: String(body.phone || '0599000782'), name: name, role: 'customer', status: 'active',
          vehicle: null, plate: null, rating: null, createdAt: nowMs(), email: body.email || null,
          permanentlyApprovedAt: null, phoneVerifiedAt: null, emailVerifiedAt: null };
      } else if (!state.user) {
        // Login with any password works in the demo: found the one seeded user.
        state.user = { id: 1, phone: '0599000782', name: 'Wind Demo', role: 'customer', status: 'active',
          vehicle: null, plate: null, rating: null, createdAt: nowMs() - 30 * 86400e3, email: 'demo@example.test',
          permanentlyApprovedAt: null, phoneVerifiedAt: null, emailVerifiedAt: null };
      }
      state.token = 'demo-token-' + Math.random().toString(36).slice(2);
      state.rideCount = 2;
      save();
      return ok(Object.assign(mePayload(), { token: state.token }));
    }

    if (!auth(init)) return fail(401, 'unauthorized');

    if (p === '/api/me' && m === 'GET') return ok(mePayload());
    if (p === '/api/me/places') {
      if (m === 'GET') return ok({ saved: state.places, recent: state.recent });
      if (m === 'POST') {
        var b = parseBody(init);
        state.places.push({ id: state.nextPlaceId++, label: b.label || 'home', city: b.city || 'ramallah', note: String(b.note || '') });
        save();
        return ok({ saved: state.places, recent: state.recent });
      }
      return ok({ saved: state.places, recent: state.recent });
    }
    var placesDelete = /^\/api\/me\/places\/(\d+)$/.exec(p);
    if (placesDelete && m === 'DELETE') {
      var delId = Number(placesDelete[1]);
      state.places = state.places.filter(function (pl) { return pl.id !== delId; });
      save();
      return ok({ saved: state.places, recent: state.recent });
    }
    if (p === '/api/me/referral') return ok({ code: 'WIND25', reward: 25, joined: 1, earned: 0, credits: [] });
    if (p === '/api/roads') {
      return ok([{ id: 1, name: 'Al-Irsal', cities: ['ramallah'], point: null, status: 'slow',
        note: 'Weekly market congestion', reportedAt: nowMs() - 3600e3, agreeing: 12 }]);
    }
    if (p === '/api/price' && m === 'POST') {
      var pb = parseBody(init);
      var q = priceFor(pb.service);
      return ok({ price: q.price, km: q.km, minutes: q.minutes, delayMinutes: 0, night: false,
        slow: [], closed: [], avoids: [], estimated: true, standard: false, line: null, at: nowMs() });
    }
    if (p === '/api/promos/check' && m === 'POST') {
      var promo = parseBody(init);
      if (String(promo.code || '').toUpperCase() === 'WIND25') return ok({ code: 'WIND25', discount: 0.25 });
      return fail(400, 'promo_not_found');
    }
    if (p === '/api/orders' && m === 'GET') {
      return ok(state.orders.map(promote).slice().sort(function (a, b) { return b.id - a.id; }));
    }
    if (p === '/api/orders' && m === 'POST') {
      var ob = parseBody(init);
      var created = newOrder(ob);
      state.orders.unshift(created);
      save();
      return ok(created);
    }
    var orderMatch = /^\/api\/orders\/(\d+)$/.exec(p);
    if (orderMatch && m === 'GET') {
      var order = findOrder(Number(orderMatch[1]));
      return order ? ok(promote(order)) : fail(404, 'not_found');
    }
    var actionMatch = /^\/api\/orders\/(\d+)\/([a-z_/]+)$/.exec(p);
    if (actionMatch && m === 'POST') {
      var actionOrder = findOrder(Number(actionMatch[1]));
      if (!actionOrder) return fail(404, 'not_found');
      if (actionMatch[2] === 'cancel') {
        actionOrder.status = 'cancelled'; actionOrder.updatedAt = nowMs();
        save();
        return ok(actionOrder);
      }
      if (actionMatch[2] === 'rate' || actionMatch[2] === 'sos') return ok(actionOrder);
      if (actionMatch[2] === 'share') return ok({ path: '/track/demo-' + actionOrder.id });
      if (actionMatch[2] === 'share/revoke') return ok(actionOrder);
      if (actionMatch[2] === 'messages') return ok([]);
      return ok(actionOrder);
    }
    var messagesMatch = /^\/api\/orders\/(\d+)\/messages$/.exec(p);
    if (messagesMatch && m === 'GET') return ok([]);

  var realFetch = window.fetch ? window.fetch.bind(window) : null;

    }
    return realFetch(input, init);
  };

  // Demo badge — honest label, small and unobtrusive.
  try {
    var badge = document.createElement('div');
    badge.textContent = 'Demo - synthetic data, no real drivers';
    badge.style.cssText = 'position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:2147483647;pointer-events:none;background:rgba(13,59,46,.85);color:#fff;font:500 11px/1 system-ui,-apple-system,sans-serif;padding:6px 14px;border-radius:14px;letter-spacing:.2px';
